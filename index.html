<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cap 90</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1411">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0e1411;--card:#18211c;--card2:#1f2a24;--line:#2a372f;--txt:#eef3ee;--mut:#93a399;--acc:#b6f24a;--acc2:#ffb454;--bad:#ff6b6b;--blue:#6cc5ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{max-width:560px;margin:0 auto;padding:0 14px calc(84px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0}h2{font-size:1.25rem}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:11px 14px;min-height:44px}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:#10160f;border-color:var(--acc);font-weight:700}
button.warn{border-color:var(--bad);color:var(--bad)}
button.ghost{background:none}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;min-height:44px}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 4px}
.mut{color:var(--mut)}.small{font-size:.85rem}.acc{color:var(--acc)}.bad{color:var(--bad)}.amb{color:var(--acc2)}
#top{display:flex;align-items:center;gap:8px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
#top h1{font-size:1.3rem;flex:1;letter-spacing:-.02em}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:.85rem;font-weight:600;white-space:nowrap}
#top button{min-height:36px;padding:5px 10px;border-radius:99px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.card>h3{margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero{background:linear-gradient(140deg,#1d2b1c,#18211c 60%)}
.hero .j{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.bar{height:9px;background:var(--bg);border-radius:9px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .5s}
.bar.amb>i{background:var(--acc2)}
.row{display:flex;align-items:center;gap:10px}.row>.g{flex:1;min-width:0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btns>button{flex:1 1 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{min-height:36px;padding:6px 12px;border-radius:99px;font-size:.88rem}
.chips button.on{background:var(--acc);color:#10160f;border-color:var(--acc);font-weight:600}
.chk{display:flex;width:100%;align-items:center;gap:10px;text-align:left;margin-bottom:8px}
.chk span{flex:1}.chk b{color:var(--mut);font-size:.85rem}
.chk.on{background:#24361b;border-color:var(--acc)}.chk.on b{color:var(--acc);font-size:1.1rem}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{padding:10px 4px;font-size:.9rem}
.seg3 .on.effort{background:#24361b;border-color:var(--acc)}
.seg3 .on.normal{background:#1d3040;border-color:var(--blue)}
.seg3 .on.exces{background:#3a2020;border-color:var(--bad)}
.cnt{margin-top:8px}.cnt button{min-height:38px;width:42px;padding:0}.cnt b{width:28px;text-align:center}
.mis{margin:9px 0}.mis .row{font-size:.92rem}.mis .ok{color:var(--acc);font-weight:700}
#nav{position:fixed;left:0;right:0;bottom:0;background:#131a16ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
#nav button{flex:1;max-width:140px;border:0;background:none;border-radius:0;padding:9px 2px;font-size:.72rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button i{font-style:normal;font-size:1.35rem}
#nav button.on{color:var(--acc)}
#modal{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:flex-end;justify-content:center}
#modal>.sheet{background:var(--card);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom));border:1px solid var(--line)}
#modal.lock>.sheet{height:100vh;max-height:100vh;border-radius:0;display:flex;flex-direction:column}
.x{float:right;min-height:34px;padding:2px 12px;border-radius:99px}
.center{text-align:center}
.big{font-size:4.2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1;text-align:center;font-variant-numeric:tabular-nums}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}.stat span{font-size:.75rem;color:var(--mut)}
.step{display:flex;justify-content:center;align-items:center;gap:18px;margin:18px 0}
.step button{width:64px;height:64px;font-size:1.8rem;border-radius:50%}
.spacer{flex:1}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font-size:9px}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-width:0 0 1px;border-radius:0;text-align:left}
.li:last-child{border-bottom:0}.li .ic{font-size:1.5rem}.li .g{flex:1;min-width:0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{padding:6px 0;min-height:62px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem}
.days button.today{border-color:var(--acc)}.days button:disabled{opacity:.35}
.dots{display:flex;gap:3px;height:7px}.dots i{width:7px;height:7px;border-radius:50%}
.fbar{width:70%;height:4px;border-radius:4px;background:var(--line)}
.fbar.effort{background:var(--acc)}.fbar.normal{background:var(--blue)}.fbar.exces{background:var(--bad)}
.phase{display:flex;gap:10px;padding:9px 0;opacity:.55}.phase.on{opacity:1}.phase b{color:var(--acc2)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center;font-size:.75rem;opacity:.3;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;border:1px solid var(--acc2)}.badge i{font-style:normal;font-size:1.7rem;display:block}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos button{padding:0;overflow:hidden;aspect-ratio:3/4;position:relative}
.photos img,.cmp img{width:100%;height:100%;object-fit:cover;display:block}
.photos span{position:absolute;left:0;right:0;bottom:0;background:#000a;font-size:.68rem;padding:2px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cmp>div{aspect-ratio:3/4;background:var(--bg);border-radius:12px;overflow:hidden}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-20px);background:var(--acc);color:#10160f;font-weight:700;padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;z-index:30;text-align:center;max-width:90%}
#toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:25;width:100%;height:100%}
.fj,.fd{display:none}
[data-t=jardin] .fj{display:block}
[data-t=velo] .fd,[data-t=frac] .fd,[data-t=marche] .fd,[data-t=natation] .fd{display:block}
ul.ex a{text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.fig{width:100%;display:block;margin:10px auto;color:var(--txt);background:var(--bg);border-radius:12px;padding:4px}
ul.ex{margin:6px 0 0;padding-left:18px;font-size:.92rem}ul.ex li{margin:3px 0}
</style>
</head>
<body>
<header id="top"></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="modal" hidden></div>
<canvas id="confetti"></canvas>
<div id="toast"></div>
<input type="file" id="gpxIn" accept=".gpx,application/gpx+xml,text/xml,application/xml" hidden>
<input type="file" id="phIn" accept="image/*" hidden>
<input type="file" id="bakIn" accept=".json,application/json" hidden>
<script>
'use strict';
/* ================= utilitaires ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const monday=s=>addDays(s,-((parse(s).getDay()+6)%7));
const fmtD=(s,o={weekday:'short',day:'numeric',month:'short'})=>parse(s).toLocaleDateString('fr-FR',o);
const clock=s=>{s=Math.max(0,Math.round(s));return(s>=3600?Math.floor(s/3600)+':':'')+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h} h ${pad(m)}`:m?`${m} min${s%60?' '+pad(s%60):''}`:`${s} s`};
const n1=(x,d=1)=>x==null||isNaN(x)?'–':x.toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* ================= stockage local (IndexedDB) ================= */
const DB=(()=>{let p;
  const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('cap90',1);
    r.onupgradeneeded=()=>['kv','tracks','photos'].forEach(n=>r.result.createObjectStore(n));
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
  const tx=async(s,mode,fn)=>{const d=await open();return new Promise((res,rej)=>{const t=d.transaction(s,mode);const q=fn(t.objectStore(s));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
  return{get:(s,k)=>tx(s,'readonly',o=>o.get(k)),set:(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k)),del:(s,k)=>tx(s,'readwrite',o=>o.delete(k)),
    keys:s=>tx(s,'readonly',o=>o.getAllKeys()),clear:s=>tx(s,'readwrite',o=>o.clear())}})();

const DEF=()=>({v:1,profile:{start:today(),startWeight:100,goalWeight:90,goalDate:'2027-03-17'},
  settings:{conso:true,thr:{velo:18,marche:5.5},rest:75,sound:true,tMidi:'12:15',tSoir:'21:30',micro:true},
  days:{},acts:[],weights:[],photos:[],tests:[],prog:{},best:{},lastRenfo:'B',travel:false,badges:{},lastLevel:0,weeksDone:{}});
let S=DEF();
let saveT;const save=()=>{clearTimeout(saveT);saveT=setTimeout(()=>DB.set('kv','state',S).catch(e=>toast('Erreur de sauvegarde : '+e)),150)};
const day=d=>S.days[d]||(S.days[d]={});
const dget=d=>S.days[d]||{};

/* ================= programme ================= */
const TYPES={
  renfo:{n:'Muscu haut du corps',i:'💪',slot:'renfo',xp:40},
  hotel:{n:'Plan B / hôtel',i:'🏨',slot:'joker',xp:25},
  velo:{n:'Vélo',i:'🚵',slot:'cardio',xp:40,gps:1},
  frac:{n:'Fractionné',i:'⚡',slot:'cardio',xp:50,gps:1},
  marche:{n:'Marche / rando',i:'🥾',slot:'libre',xp:20,gps:1},
  natation:{n:'Piscine',i:'🏊',slot:'cardio',xp:40},
  jardin:{n:'Jardin',i:'🪓',slot:'libre',xp:30},
  autre:{n:'Autre',i:'✨',slot:'libre',xp:25}};
const JARDIN=['Tonte','Débroussaillage','Tronçonnage / abattage','Fendage / rangement de bois','Bêchage / labour','Fumier / brouette','Taille / divers'];
const RPE=['Facile','Tranquille','Soutenu','Dur','À fond'];
const LOGS=[['bûche légère (5-8 kg)',8,15],['bûche moyenne (10-15 kg)',8,15],['grosse bûche (18-25 kg)',6,15]];
const logV=(name,desc)=>LOGS.map(([l,min,max])=>({n:`${name}, ${l}`,d:desc,min,max}));
const EX={
  pompes:{n:'Pompes',m:'pectoraux, épaules, arrière des bras',unit:'reps',variants:[
    {n:'Pompes inclinées',d:"Mains posées sur une table ou un gros rondin, pieds reculés, corps bien droit de la tête aux talons. Plie les bras pour amener la poitrine vers le bord, puis repousse. Plus le support est haut, plus c’est facile.",min:6,max:12},
    {n:'Pompes classiques',f:'pompesC',d:"Mains au sol sous les épaules, corps droit comme une planche. Descends la poitrine près du sol, coudes légèrement écartés, puis repousse.",min:5,max:15},
    {n:'Pompes pieds surélevés',f:'pompesC',d:"Comme les pompes classiques, mais les pieds posés sur une bûche. Garde le ventre serré.",min:6,max:15}]},
  rowing:{n:'Tirage de bûche',m:'dos, arrière des épaules',unit:'reps',variants:logV('Tirage',"Debout, pieds écartés, genoux un peu pliés. Penche le buste en avant en gardant le dos bien plat : la bûche pend au bout des bras. Tire-la vers le nombril en serrant les omoplates, puis redescends lentement.")},
  developpe:{n:'Bûche au-dessus de la tête',m:'épaules',unit:'reps',variants:logV('Poussée au-dessus de la tête',"Debout, bûche tenue à deux mains devant la poitrine. Pousse-la au-dessus de la tête jusqu’à tendre les bras, sans cambrer le dos, puis redescends lentement.")},
  curl:{n:'Flexion des bras',m:'biceps (avant des bras)',unit:'reps',variants:logV('Flexion des bras',"Debout, bras tendus vers le bas, bûche tenue paumes vers le haut. Plie les coudes pour monter la bûche vers les épaules, coudes collés au corps, puis redescends lentement.")},
  dips:{n:'Pompes arrière sur banc',m:'triceps (arrière des bras)',unit:'reps',variants:[
    {n:'Pompes arrière sur banc, jambes pliées',d:"Assieds-toi au bord d’un banc, d’une chaise calée ou d’un gros rondin stable, mains de chaque côté des fesses. Avance les fesses dans le vide, puis plie les coudes pour descendre et pousse sur les mains pour remonter.",min:5,max:15},
    {n:'Pompes arrière sur banc, jambes tendues',d:"Même mouvement, jambes tendues et talons loin devant : c’est plus lourd.",min:6,max:15}]},
  planche:{n:'Gainage',m:'abdos, dos',unit:'sec',variants:[
    {n:'Gainage sur les avant-bras',d:"Face au sol, en appui sur les avant-bras et les pointes de pieds. Le corps forme une ligne droite de la tête aux talons. Serre le ventre et les fesses, respire, et tiens sans bouger.",min:20,max:75},
    {n:'Gainage avec levée de jambe',d:"Même position. Lève un pied du sol 2 secondes, repose, puis l’autre, sans bouger le bassin.",min:30,max:90}]},
  abdos:{n:'Abdos au sol',m:'abdos',unit:'reps',variants:[
    {n:'Bras et jambe opposés (par côté)',d:"Allongé sur le dos, bras tendus vers le plafond, genoux pliés à angle droit au-dessus des hanches. Descends en même temps un bras derrière la tête et la jambe opposée vers le sol, sans décoller le bas du dos. Reviens, change de côté.",min:6,max:15},
    {n:'Relevés de jambes allongé',d:"Allongé sur le dos, jambes tendues. Monte les jambes à la verticale, puis redescends lentement sans toucher le sol.",min:6,max:15},
    {n:'Relevés de jambes et de bassin',d:"Comme les relevés de jambes, et une fois en haut décolle les fesses du sol.",min:6,max:15}]},
  portage:{n:'Portage de bûches',m:'avant-bras, dos, abdos',unit:'sec',variants:[
    {n:'Portage, 2 bûches moyennes',d:"Une bûche dans chaque main, bras le long du corps, épaules basses. Marche droit et tranquillement pendant le temps indiqué, sans te pencher.",min:30,max:60},
    {n:'Portage, 2 grosses bûches',d:"Même chose avec des bûches plus lourdes.",min:30,max:75}]},
  squat:{n:'Assis-debout sur chaise',m:'cuisses, fessiers',unit:'reps',variants:[
    {n:'Assis-debout sur chaise',d:"Assieds-toi sur une chaise puis relève-toi, sans t’aider des mains, les genoux dans l’axe des pieds. Doux pour les genoux.",min:10,max:20},
    {n:'Assis-debout lent',d:"Descends en 3 secondes, effleure la chaise sans t’asseoir, remonte.",min:8,max:20}]},
  superman:{n:'Extension du dos',m:'bas du dos, fessiers',unit:'reps',variants:[
    {n:'Extension du dos à plat ventre',d:"Allongé à plat ventre, bras tendus devant. Décolle en même temps les bras et les jambes du sol, tiens 2 secondes, relâche. Regarde le sol pour ne pas casser la nuque.",min:8,max:15},
    {n:'Extension du dos, coudes tirés',d:"Même mouvement, et en haut ramène les coudes vers les hanches en serrant les omoplates.",min:8,max:15}]}};
// Schémas : silhouettes en bâtons. a = position de départ, b = position d'arrivée, p = accessoires.
const FIG={
  pompes:{p:[['r',80,42,30,3],['l',106,45,106,68]],a:{h:[73,32],l:[[20,68,45,54,66,38],[66,38,82,42]]},b:{h:[79,39],l:[[20,68,47,56,72,44],[72,44,68,52,82,42]]}},
  pompesC:{a:{h:[88,42],l:[[15,66,48,56,80,46],[80,46,82,68]]},b:{h:[88,57],l:[[15,66,48,62,80,60],[80,60,71,52,82,68]]}},
  rowing:{a:{h:[85,32],l:[[55,68,59,56,50,44,78,36],[78,36,78,56]],p:[['r',69,56,18,6]]},b:{h:[85,32],l:[[55,68,59,56,50,44,78,36],[78,36,64,30,70,43]],p:[['r',61,43,18,6]]}},
  developpe:{a:{h:[60,22],l:[[60,68,60,30],[60,30,68,40,70,31]],p:[['r',62,28,20,6]]},b:{h:[60,22],l:[[60,68,60,30],[60,30,62,9]],p:[['r',52,3,22,6]]}},
  curl:{a:{h:[60,22],l:[[60,68,60,30],[60,30,64,50]],p:[['r',56,50,20,6]]},b:{h:[60,22],l:[[60,68,60,30],[60,30,63,42,70,33]],p:[['r',62,27,20,6]]}},
  dips:{p:[['r',30,46,26,3],['l',33,49,33,68],['l',53,49,53,68]],a:{h:[58,22],l:[[58,30,62,46,80,48,84,68],[58,30,54,46]]},b:{h:[60,32],l:[[60,40,64,56,82,50,84,68],[60,40,48,38,54,46]]}},
  planche:{a:{h:[90,47],l:[[15,66,50,56,82,50],[82,50,82,66,94,66]]}},
  abdos:{a:{h:[20,60],l:[[28,62,60,62],[28,62,28,40],[60,62,60,44,76,44]]},b:{h:[20,60],l:[[28,62,60,62],[28,62,28,40],[28,62,8,57],[60,62,60,44,76,44],[60,62,96,57]]}},
  portage:{a:{h:[60,22],l:[[54,68,60,46,60,30],[66,68,60,46],[60,30,60,50]],p:[['r',54,50,12,8]]}},
  squat:{p:[['l',30,50,48,50],['l',32,50,32,68],['l',46,50,46,68],['l',30,50,30,30]],a:{h:[44,22],l:[[44,30,42,48,60,48,60,68],[44,30,60,34]]},b:{h:[60,22],l:[[60,68,60,30],[60,30,74,32]]}},
  superman:{a:{h:[93,61],l:[[15,64,55,64,85,64],[85,64,108,64]]},b:{h:[93,55],l:[[12,56,55,64,85,60],[85,60,108,52]]}}};
function fig(id,v=0){const F=FIG[EX[id].variants[v]?.f||id];if(!F)return'';
  const pose=(P,dx)=>`<g transform="translate(${dx})"><line x1="4" x2="116" y1="69.5" y2="69.5" stroke="#2a372f" stroke-width="1.5"/>${[...(F.p||[]),...(P.p||[])].map(q=>q[0]==='r'?`<rect x="${q[1]}" y="${q[2]}" width="${q[3]}" height="${q[4]}" rx="2.5" fill="#ffb454" stroke="none"/>`:`<line x1="${q[1]}" y1="${q[2]}" x2="${q[3]}" y2="${q[4]}" stroke="#ffb454" stroke-width="2.5"/>`).join('')}${P.l.map(l=>`<polyline points="${l.join(' ')}"/>`).join('')}<circle cx="${P.h[0]}" cy="${P.h[1]}" r="5.5" fill="currentColor" stroke="none"/></g>`;
  return`<svg class="fig" viewBox="0 0 ${F.b?260:120} 74" style="max-width:${F.b?340:160}px" role="img" aria-label="Schéma de l’exercice"><g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">${pose(F.a,0)}${F.b?`<path d="M122 38h14m-5-5 5 5-5 5" stroke="#93a399" stroke-width="2"/>`+pose(F.b,140):''}</g></svg>`}

function chart(series,o={}){const W=340,H=o.h||150,L=32,Rr=8,T=8,B=18;
  const all=series.flatMap(s=>s.pts);if(!all.length)return'<p class="mut small">Pas encore de données.</p>';
  let x0=Math.min(...all.map(p=>p[0])),x1=Math.max(...all.map(p=>p[0])),y0=Math.min(...all.map(p=>p[1])),y1=Math.max(...all.map(p=>p[1]));
  if(x0===x1){x0-=1;x1+=1}const py=(y1-y0)*.12||1;y0=o.y0??y0-py;y1=o.y1??y1+py;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-Rr),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2a372f"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end">${n1(v,o.dec??0)}</text>`}
  const xf=o.xf||(v=>n1(v,0));g+=`<text x="${L}" y="${H-4}">${xf(x0)}</text><text x="${W-Rr}" y="${H-4}" text-anchor="end">${xf(x1)}</text>`;
  for(const s of series){if(!s.pts.length)continue;
    g+=`<path d="${s.pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('')}" fill="none" stroke="${s.c||'#b6f24a'}" stroke-width="${s.wd||2}" ${s.dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round"/>`;
    if(s.dots)g+=s.pts.map(p=>`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.2" fill="${s.c||'#b6f24a'}"/>`).join('')}

/* ================= analyse de trace GPS ================= */
function hav(a,b){const r=Math.PI/180,dl=(b[1]-a[1])*r,dn=(b[2]-a[2])*r,h=Math.sin(dl/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dn/2)**2;return 12742000*Math.asin(Math.sqrt(h))}
const thrOf=t=>t==='marche'?S.settings.thr.marche:S.settings.thr.velo;
// points : [t(ms), lat, lon, alt, fc, débutDeSegment]
function analyze(pts,thr){const sg=[];let dist=0,gain=0,ref=null,hs=0,hn=0,hm=0;
  for(let i=0;i<pts.length;i++){const b=pts[i];if(b[4]){hs+=b[4];hn++;hm=Math.max(hm,b[4])}
    if(b[3]!=null){if(ref==null)ref=b[3];else if(b[3]-ref>3){gain+=b[3]-ref;ref=b[3]}else if(ref-b[3]>3)ref=b[3]}
    if(!i||b[5])continue;const a=pts[i-1],dt=(b[0]-a[0])/1000;if(dt<=0||dt>300)continue;const d=hav(a,b);if(d/dt>40)continue;
    dist+=d;sg.push({t:b[0],dt,d})}
  if(!sg.length)return null;
  for(let i=0;i<sg.length;i++){let D=0,T=0;for(let j=i;j>=0&&T<10;j--){if(j<i&&sg[j+1].t-sg[j+1].dt*1000-sg[j].t>1500)break;D+=sg[j].d;T+=sg[j].dt}sg[i].v=D/T*3.6}
  let mov=0,tot=0,vmax=0;const mv=[];for(const s of sg){tot+=s.dt;vmax=Math.max(vmax,s.v);if(s.v>1.5){mov+=s.dt;mv.push(s)}}
  const sorted=[...mv].sort((a,b)=>a.v-b.v);const pc=q=>{let c=0;for(const s of sorted){c+=s.dt;if(c>=mov*q)return s.v}return 0};
  const runs=[];let cur=null;for(const s of sg){if(s.v<thr)continue;const st=s.t-s.dt*1000;if(cur&&st-cur.end<=8000)cur.end=s.t;else runs.push(cur={start:st,end:s.t})}
  const eff=runs.filter(r=>r.end-r.start>=20000),durs=eff.map(r=>(r.end-r.start)/1000);
  const recs=eff.slice(1).map((r,i)=>(r.start-eff[i].end)/1000);
  const step=Math.ceil(sg.length/240),t0=sg[0].t,series=[];for(let i=0;i<sg.length;i+=step)series.push([Math.round((sg[i].t-t0)/600)/100,Math.round(sg[i].v*10)/10]);
  const hiT=durs.reduce((a,b)=>a+b,0);
  return{dist:dist/1000,dur:tot,mov,avg:mov?dist/mov*3.6:0,vmax,p10:pc(.1),p90:pc(.9),hiT,hiPct:mov?Math.min(100,hiT/mov*100):0,hiMax:Math.max(0,...durs),hiN:eff.length,rec:avg(recs),
    gain:ref==null?null:gain,hr:hn?{avg:hs/hn,max:hm}:null,thr,series}}
function parseGPX(txt){const x=new DOMParser().parseFromString(txt,'application/xml'),pts=[];
  for(const seg of x.getElementsByTagNameNS('*','trkseg')){let first=true;
    for(const p of seg.getElementsByTagNameNS('*','trkpt')){const tm=p.getElementsByTagNameNS('*','time')[0];if(!tm)continue;const t=Date.parse(tm.textContent);if(isNaN(t))continue;
      const el=p.getElementsByTagNameNS('*','ele')[0],hr=p.getElementsByTagNameNS('*','hr')[0];
      pts.push([t,+p.getAttribute('lat'),+p.getAttribute('lon'),el?+el.textContent:null,hr?+hr.textContent:null,first&&pts.length?1:0]);first=false}}
  return pts}

function startRun(kind){const hotel=kind==='hotel',n=hotel?2:3;
  const exs=SESS[kind].map(id=>{const p=pg(id);return{id,v:p.v,t:p.t,sets:id==='portage'?2:n,done:[]}});
  const steps=[];if(hotel)for(let s=0;s<n;s++)exs.forEach((e,i)=>steps.push(i));else exs.forEach((e,i)=>{for(let s=0;s<e.sets;s++)steps.push(i)});
  R={kind,exs,steps,i:0,phase:'work',t0:Date.now(),rest:hotel?30:S.settings.rest,val:0,sw:null};wake();drawRun()}
function drawRun(){const e=R.exs[R.steps[R.i]],X=EX[e.id],V=X.variants[e.v],sec=X.unit==='sec';R.cur=e;
  const head=`<div class="row"><span class="g mut small">${R.kind==='hotel'?'Plan B':'Séance '+R.kind} · étape ${R.i+1}/${R.steps.length}</span><button class="ghost" style="min-height:34px;padding:2px 10px" data-a="rquit">Arrêter</button></div><div class="bar"><i style="width:${R.i/R.steps.length*100}%"></i></div>`;
  if(R.phase==='rest'){openModal(`${head}<div class="spacer"></div><p class="center mut">Repos</p><div class="big" id="r-rest">${clock((R.restEnd-Date.now())/1000)}</div>
    <p class="center">Ensuite : <b>${V.n}</b><br><span class="mut">série ${e.done.length+1}/${e.sets} · cible ${e.t}${sec?' s':' reps'}</span></p><div class="spacer"></div>
    <div class="btns"><button data-a="rmore">+15 s</button><button class="pri" data-a="rgo">Passer le repos</button></div>`,true);return}
  R.val=e.t;R.sw=null;R.beeped=0;
  openModal(`${head}<h2 style="margin-top:14px">${V.n}</h2>${fig(e.id,e.v)}<p style="margin:6px 0">${V.d}</p><p class="mut small" style="margin:0 0 6px">Fait travailler : ${X.m}.</p><p>Série <b>${e.done.length+1}/${e.sets}</b>${e.done.length?` <span class="mut">· déjà fait : ${e.done.join(' · ')}</span>`:''}</p><div class="spacer"></div>
  ${sec?`<p class="center mut">Tiens ${e.t} secondes</p><div class="big" id="r-sw">0 s</div><div class="spacer"></div><div class="btns"><button data-a="rskip">Passer</button><button class="pri" id="r-swb" data-a="rsw">▶ Démarrer le chrono</button></div>`
  :`<p class="center mut">Cible : ${e.t} répétitions. Ajuste si tu en fais plus ou moins.</p><div class="step"><button data-a="rstep" data-n="-1">−</button><div class="big" id="r-val" style="min-width:110px">${e.t}</div><button data-a="rstep" data-n="1">+</button></div><div class="spacer"></div>
  <div class="btns"><button data-a="rskip">Passer</button><button class="pri" data-a="rdone">✔ Série faite</button></div>`}`,true)}
function runSet(v){R.cur.done.push(v);R.i++;buzz(40);if(R.i>=R.steps.length)return finishRun();R.phase='rest';R.restEnd=Date.now()+R.rest*1000;drawRun()}
function finishRun(){const dur=Math.max(1,Math.round((Date.now()-R.t0)/60000)),prs=[],ups=[];
  for(const e of R.exs){if(!e.done.length)continue;const X=EX[e.id],V=X.variants[e.v],u=X.unit==='sec'?' s':'',step=u?5:1,p=pg(e.id),mx=Math.max(...e.done),mn=Math.min(...e.done),key=e.id+':'+e.v;
    if(S.best[key]!=null&&mx>S.best[key])prs.push(`${V.n} : ${mx}${u}`);S.best[key]=Math.max(S.best[key]||0,mx);
    if(p.v!==e.v)continue;
    if(e.done.length>=e.sets&&mn>=e.t){const t=Math.max(e.t+step,mn);
      if(t>V.max&&X.variants[e.v+1]){p.v=e.v+1;p.t=X.variants[p.v].min;ups.push(`🚀 Nouveau palier : ${X.variants[p.v].n}`)}else{p.t=t;ups.push(`${V.n} : prochaine cible ${t}${u}`)}}
    else if(mx<e.t)p.t=Math.max(V.min,e.t-step)}
  const hotel=R.kind==='hotel';const a={id:uid(),date:today(),type:hotel?'hotel':'renfo',sub:R.kind,dur,sets:R.exs.map(({id,v,t,done})=>({id,v,t,done})),prs};
  S.acts.push(a);if(!hotel)S.lastRenfo=R.kind;R=null;unwake();pick=null;
  const m=checkRewards(true);save();render();confetti();buzz([80,50,80,50,200]);beep(660);setTimeout(()=>beep(990,300),200);
  openModal(`<h2 class="center">Séance bouclée 💥</h2><p class="center mut">${dur} min · +${TYPES[a.type].xp+prs.length*15} XP</p>
    ${prs.length?`<p class="amb"><b>🏅 Records battus</b><br>${prs.map(esc).join('<br>')}</p>`:''}
    ${ups.length?`<p><b>La prochaine fois</b></p><ul class="ex">${ups.map(u=>`<li>${u}</li>`).join('')}</ul>`:'<p class="mut">Mêmes cibles la prochaine fois : on consolide.</p>'}
    ${m.length?`<p class="acc">${m.join('<br>')}</p>`:''}<div class="btns"><button class="pri" data-a="close">Continuer</button></div>`)}

function gpsPos(p){if(!G)return;const c=p.coords;G.acc=c.accuracy;if(!G.run||c.accuracy>35)return;
  const pt=[p.timestamp,c.latitude,c.longitude,c.altitude,null,G.brk&&G.pts.length?1:0],last=G.pts[G.pts.length-1];
  if(last&&!G.brk){const d=hav(last,pt),dt=(pt[0]-last[0])/1000;if(dt<=0||(d<3&&dt<4))return;G.dist+=d;G.spd=c.speed!=null?c.speed*3.6:d/dt*3.6}
  G.pts.push(pt);G.brk=false}
const gpsEl=()=>((G.run?Date.now():G.pausedAt)-G.t0-G.pausedMs)/1000;

setInterval(()=>{const now=Date.now();

  walk(d){const D=day(d.d);D.walk=!D.walk;if(S.travel&&d.d===today())D.travel=true;buzz(30);after(D.walk?'+10 XP 🐕':'');if(dayOpen)dayModal(dayOpen)},
  food(d){const D=day(d.d);D.food=D.food===d.k?null:d.k;buzz(30);after(D.food?{effort:'+15 XP 💪',normal:'+10 XP 👌',exces:'Noté, sans jugement. +3 XP pour l’honnêteté'}[D.food]:'');if(dayOpen)dayModal(dayOpen)},
  cnt(d){const D=day(d.d);D[d.k]=Math.max(0,(D[d.k]||0)+ +d.n);save();render();if(dayOpen)dayModal(dayOpen)},
  micro(){const D=day(today());D.micro=(D.micro||0)+1;buzz(40);after(D.micro<=3?'+5 XP ⚡':'Bonus pour la gloire 💪')},
  run(d){startRun(d.k)},exo(d){exoModal(d.id)},
  rstep(d){R.val=Math.max(0,R.val+ +d.n);$('#r-val').textContent=R.val},
  rdone(){runSet(R.val)},rskip(){runSet(0)},
  rsw(){if(!R.sw){R.sw=Date.now();const b=$('#r-swb');b.textContent='⏹ Stop';beep(660,100)}else runSet(Math.round((Date.now()-R.sw)/1000))},
  rgo(){R.phase='work';drawRun()},rmore(){R.restEnd+=15000},
  rquit(){const n=R.exs.reduce((s,e)=>s+e.done.length,0);if(n>=R.steps.length/2){if(confirm('Arrêter ici ? Les séries faites sont enregistrées.'))finishRun()}else if(confirm('Abandonner la séance ? Moins de la moitié est faite, elle ne sera pas enregistrée.')){R=null;unwake();closeModal()}},
  gps(d){gpsOpen(d.t)},
  gpsGo(){if(!G.t0){G.t0=Date.now();G.watch=navigator.geolocation.watchPosition(gpsPos,e=>{toast(e.code===1?'Autorise la localisation pour cette app':'Signal GPS introuvable',3000)},{enableHighAccuracy:true,maximumAge:0,timeout:20000})}else{G.pausedMs+=Date.now()-G.pausedAt;G.brk=true}G.run=true;wake();drawGps()},
  gpsPause(){G.run=false;G.pausedAt=Date.now();drawGps()},
  gpsCancel(){if(G.watch!=null)navigator.geolocation.clearWatch(G.watch);G=null;unwake();closeModal()},
  gpsStop(){if(G.run){G.run=false;G.pausedAt=Date.now()}if(G.pts.length<5){if(confirm('Presque aucun point GPS enregistré. Abandonner cette sortie ?'))A.gpsCancel();return}
    navigator.geolocation.clearWatch(G.watch);unwake();const t=G.type,pts=G.pts;G=null;pending={pts};actForm({type:t})},
  gpx(d){pending=null;F={type:d.t};$('#gpxIn').value='';$('#gpxIn').click()},
  form(d){pending=null;const dd=d.d;dayOpen=null;actForm({type:d.t,date:dd})},
  ftype(d,el){F.type=d.k;$('#f').dataset.t=d.k;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
  frpe(d,el){F.rpe=+d.k;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el))},
  async saveAct(){const a={id:uid(),date:$('#f-date').value||today(),type:F.type,rpe:F.rpe,note:$('#f-note').value.trim()};
    if(F.type==='jardin')a.sub=$('#f-sub').value;
    if(pending){const st=analyze(pending.pts,thrOf(a.type));if(!st)return toast('Trace inexploitable');await DB.set('tracks',a.id,pending.pts);a.track=1;a.stats=st;a.dist=Math.round(st.dist*100)/100;a.dur=Math.max(1,Math.round(st.mov/60))}
    else{a.dur=+$('#f-dur').value;if(!(a.dur>0))return toast('Indique la durée');const di=+($('#f-dist')?.value||0);if(di>0&&TYPES[a.type].slot!=='renfo'&&a.type!=='jardin'&&a.type!=='autre'&&a.type!=='hotel')a.dist=di}
    if(a.type==='marche')day(a.date).walk=true;
    S.acts.push(a);pick=null;closeModal();confetti();after(`${TYPES[a.type].i} +${TYPES[a.type].xp} XP`);if(a.stats)actDetail(a)},
  act(d){const a=S.acts.find(x=>x.id===d.id);if(a)actDetail(a)},
  delAct(d){if(!confirm('Supprimer cette activité ?'))return;S.acts=S.acts.filter(x=>x.id!==d.id);DB.del('tracks',d.id);closeModal();save();render()},
  weight(){weightForm()},
  saveW(){const kg=+String($('#w-kg').value).replace(',','.'),date=$('#w-date').value||today(),waist=+$('#w-waist').value||null;if(!(kg>30&&kg<300))return toast('Poids invalide');
    const prev=curW(),had=S.weights.length;S.weights=S.weights.filter(w=>w.date!==date);S.weights.push({date,kg,waist});S.weights.sort((a,b)=>a.date.localeCompare(b.date));closeModal();
    const dlt=prev-kg;after(had&&dlt>0?`⚖️ −${n1(dlt)} kg ! +20 XP`:'⚖️ Pesée notée. +20 XP');if(had&&dlt>0)confetti()},
  delW(d){if(confirm('Supprimer cette pesée ?')){S.weights=S.weights.filter(w=>w.date!==d.d);save();render()}},
  test(){testForm()},
  saveTest(){const p=+$('#t-p').value,pl=+$('#t-pl').value;if(!(p>=0)||!(pl>=0)||(!p&&!pl))return toast('Remplis au moins une valeur');
    const prev=S.tests[S.tests.length-1];S.tests.push({date:today(),pompes:p,planche:pl});closeModal();
    after(prev?`🧪 Pompes ${p-prev.pompes>=0?'+':''}${p-prev.pompes}, planche ${pl-prev.planche>=0?'+':''}${pl-prev.planche} s`:'🧪 Point de départ enregistré. +30 XP');if(prev&&(p>prev.pompes||pl>prev.planche))confetti()},
  photo(d){phTag=d.k;$('#phIn').value='';$('#phIn').click()},
  phTag(d){phTag=d.k;cmp={a:null,b:null};render()},
  phView(d){const p=S.photos.find(x=>x.id===d.id);openModal(`<p class="mut">${fmtD(p.date,{weekday:'long',day:'numeric',month:'long'})} · ${PHT[p.tag]}</p><img data-ph="${p.id}" style="width:100%;border-radius:12px" alt=""><div class="btns"><button class="warn" data-a="delPh" data-id="${p.id}">Supprimer</button></div>`);fillPhotos()},
  delPh(d){if(!confirm('Supprimer cette photo ?'))return;S.photos=S.photos.filter(x=>x.id!==d.id);DB.del('photos',d.id);closeModal();save();render()},
  settings(){settingsForm()},ics(){makeIcs()},export(){exportAll()},import(){$('#bakIn').value='';$('#bakIn').click()},
  async reset(){if(!confirm('Effacer TOUTES les données de l’app sur cet appareil ?')||!confirm('Vraiment tout ? C’est définitif.'))return;await DB.clear('tracks');await DB.clear('photos');S=DEF();await DB.set('kv','state',S);closeModal();render()}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset,el,e)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='gpxIn'&&el.files[0]){el.files[0].text().then(t=>{const pts=parseGPX(t);if(pts.length<5)return toast('GPX sans points horodatés : impossible de calculer les vitesses',3500);
    pending={pts};const st=analyze(pts,thrOf('velo'));actForm({type:F?.type||(st&&st.avg<7?'marche':'velo'),date:iso(new Date(pts[0][0]))})})}
  else if(el.id==='phIn'&&el.files[0])addPhoto(el.files[0],phTag);
  else if(el.id==='bakIn'&&el.files[0])importAll(el.files[0]);
  else if(el.dataset.c==='cmpA'){cmp.a=el.value;render()}else if(el.dataset.c==='cmpB'){cmp.b=el.value;render()}
  else if(el.dataset.s){const path=el.dataset.s.split('.');let o=S;while(path.length>1)o=o[path.shift()];
    const v=el.type==='checkbox'?el.checked:el.type==='number'?+el.value:el.value;if(el.type==='number'&&!(v>0))return;if(el.type==='date'&&!v)return;o[path[0]]=v;save();
    if(el.dataset.s.startsWith('settings.thr'))recompute();else render()}});

/* ================= démarrage ================= */
(async()=>{try{const st=await DB.get('kv','state');if(st)S=merge(st);else await DB.set('kv','state',S)}catch(e){toast('Stockage local indisponible : '+e,6000)}
  checkRewards(true);render();
  navigator.storage?.persist?.();
  if('serviceWorker'in navigator&&!/^(localhost|127\.)/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
</script>
</body>
